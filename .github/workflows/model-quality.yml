name: Model quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pilot-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - name: Check declared model quality bars
        run: uv run python scripts/check_eval.py --quality
